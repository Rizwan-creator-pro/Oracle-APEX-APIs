[[redirects]]
  from = "/gym/*"
  to = "https://oracleapex.com/ords/r/medimatrics/royal-gym/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/gym"
  to = "https://oracleapex.com/ords/r/medimatrics/royal-gym/login"
  status = 200
  force = true

[functions]

  [functions.emails]
  included_files = [
    "./emails/**"
  ]

[context]

  [context.production]

    [context.production.functions]

      [context.production.functions.emails]
      included_files = [
        "./emails/**"
      ]

  [context.main]

    [context.main.functions]

      [context.main.functions.emails]
      included_files = [
        "./emails/**"
      ]
